<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- PRESENTATION TITLE --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =============================================
           DESIGN TOKENS
           ============================================= */
        :root {
            --bg-primary:   #f4f2ec;
            --bg-panel:     rgba(255, 255, 255, 0.78);
            --ink:          #101010;
            --muted:        rgba(16, 16, 16, 0.65);
            --line:         rgba(16, 16, 16, 0.14);
            --accent:       #ff4b1f;
            --accent-soft:  rgba(255, 75, 31, 0.08);

            --font-display: "Archivo", sans-serif;
            --font-body:    "IBM Plex Sans", sans-serif;
            --font-mono:    "IBM Plex Mono", monospace;

            --title-size:  clamp(1.8rem, 4.9vw, 4.8rem);
            --h2-size:     clamp(1.45rem, 3.4vw, 2.9rem);
            --h3-size:     clamp(1.05rem, 2vw, 1.5rem);
            --body-size:   clamp(1.22rem, 1.4vw, 1.72rem);
            --small-size:  clamp(1.06rem, 1.08vw, 1.22rem);

            --slide-padding:  clamp(1.1rem, 2.6vw, 2.5rem);
            --content-gap:    clamp(0.65rem, 1.25vw, 1.2rem);
            --element-gap:    clamp(0.35rem, 0.72vw, 0.72rem);
            --stage-margin:   clamp(1rem, 2.8vw, 3rem);

            --content-box-top:    clamp(3.9rem, 7vh, 5.1rem);
            --content-box-right:  clamp(3.55rem, 5.6vw, 5.7rem);
            --content-box-bottom: clamp(4rem, 7.4vh, 5.4rem);
            --content-box-left:   clamp(3.55rem, 5.6vw, 5.7rem);

            --duration-normal: 0.6s;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* =============================================
           RESET + BASE
           ============================================= */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overflow-x: hidden; }

        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--ink);
        }

        /* =============================================
           SLIDE SHELL: viewport → stage → content
           ============================================= */
        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background:
                linear-gradient(rgba(16, 16, 16, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 16, 16, 0.1) 1px, transparent 1px),
                radial-gradient(circle at 18% 15%, rgba(255, 255, 255, 0.72), transparent 38%),
                var(--bg-primary);
            background-size: 4.6vw 4.6vw, 4.6vw 4.6vw, auto, auto;
        }

        /* 16:9 stage constrained to viewport */
        .slide-stage {
            width:  min(calc(100vw - (var(--stage-margin) * 2)), calc((100dvh - (var(--stage-margin) * 2)) * 16 / 9));
            height: min(calc(100dvh - (var(--stage-margin) * 2)), calc((100vw - (var(--stage-margin) * 2)) * 9 / 16));
            max-width: 100vw;
            max-height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .slide-content {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            max-height: 100%;
            overflow: hidden;
            padding: var(--slide-padding);
            gap: var(--content-gap);
            width: 100%;
        }

        /* =============================================
           TYPOGRAPHY
           ============================================= */
        .kicker {
            font: 600 var(--small-size)/1 var(--font-mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h1, h2, h3 {
            font-family: var(--font-display);
            letter-spacing: -0.02em;
            text-wrap: balance;
        }
        h1 { font-size: var(--title-size); line-height: 0.95; max-width: 14ch; }
        h2 { font-size: var(--h2-size);    line-height: 1.02; max-width: 22ch; }
        h3 { font-size: var(--h3-size);    line-height: 1.1; }
        p  { font-size: var(--body-size);  line-height: 1.56; color: var(--muted); max-width: 72ch; }

        /* =============================================
           CARD COMPONENT
           ============================================= */
        .card {
            border: 1px solid var(--ink);
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            padding: clamp(0.95rem, 1.4vw, 1.6rem);
            display: flex;
            flex-direction: column;
            gap: var(--element-gap);
            min-height: 0;
            box-shadow: 6px 6px 0 rgba(16, 16, 16, 0.06);
        }

        /* =============================================
           REVEAL ANIMATION
           ============================================= */
        .reveal {
            opacity: 0;
            transform: translateY(1.4rem);
            transition:
                opacity var(--duration-normal) var(--ease-out),
                transform var(--duration-normal) var(--ease-out);
        }
        .slide.visible .reveal { opacity: 1; transform: translateY(0); }
        .slide.visible .reveal:nth-child(1) { transition-delay: 0.05s; }
        .slide.visible .reveal:nth-child(2) { transition-delay: 0.15s; }
        .slide.visible .reveal:nth-child(3) { transition-delay: 0.25s; }
        .slide.visible .reveal:nth-child(4) { transition-delay: 0.35s; }
        .slide.visible .reveal:nth-child(5) { transition-delay: 0.45s; }

        /* =============================================
           TITLE SLIDE
           ============================================= */
        .slide-title .slide-content {
            align-items: flex-start;
            justify-content: center;
            padding: var(--content-box-top) var(--content-box-right) var(--content-box-bottom) var(--content-box-left);
        }
        .slide-title .title-shell {
            width: min(100%, clamp(30rem, 42vw, 46rem));
            display: grid;
            grid-template-rows: auto auto auto;
            align-content: center;
            gap: clamp(1rem, 1.8vw, 1.6rem);
            padding: clamp(1.8rem, 3vw, 2.8rem);
        }
        .slide-title h1  { font-size: clamp(2.6rem, 6vw, 5.6rem); line-height: 0.92; max-width: 12ch; }
        .subtitle-block  { display: flex; flex-direction: column; gap: clamp(0.4rem, 0.9vw, 0.8rem); max-width: 42rem; }
        .subtitle        { font-size: clamp(1.05rem, 1.6vw, 1.55rem); line-height: 1.35; color: rgba(16,16,16,0.74); }
        .presenter-line  {
            display: flex; flex-direction: column; gap: 0.28rem;
            margin-top: clamp(2.35rem, 4.2vh, 3.9rem);
            padding-top: clamp(0.75rem, 1.2vw, 1rem);
            border-top: 1px solid rgba(16, 16, 16, 0.22);
            width: fit-content;
            font-size: clamp(0.98rem, 1.15vw, 1.18rem); line-height: 1.3; color: var(--ink);
        }
        .presenter-line span:last-child { color: var(--muted); }

        /* =============================================
           ACCENT SLASH
           ============================================= */
        .slash {
            width: clamp(6rem, 19vw, 13rem);
            height: clamp(0.55rem, 1.15vw, 1.12rem);
            background: var(--accent);
            transform: rotate(-34deg);
            margin-left: auto;
            margin-top: auto;
        }

        /* =============================================
           PRESENTATION CONTROLS
           ============================================= */
        .presentation-actions {
            position: fixed; top: 1rem; right: 1.4rem; z-index: 100;
            display: flex; gap: 0.5rem; align-items: center;
        }
        .fullscreen-toggle {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--line);
            padding: 0.45rem 1rem;
            font: 600 0.82rem/1 var(--font-mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s, background 0.2s;
        }
        .fullscreen-toggle:hover { background: rgba(255,255,255,0.96); color: var(--ink); }

        #progress {
            position: fixed; top: 0; left: 0; height: 2px;
            background: var(--accent); width: 0; z-index: 100;
            transition: width 0.3s ease;
        }
        #navDots {
            position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
            display: flex; gap: 0.55rem; z-index: 100;
        }
        #navDots button {
            width: 0.5rem; height: 0.5rem; border-radius: 50%;
            border: 1px solid var(--muted); background: transparent;
            cursor: pointer; transition: background 0.2s, transform 0.2s;
        }
        #navDots button.active { background: var(--ink); transform: scale(1.3); }

        body.is-fullscreen { --stage-margin: clamp(0.3rem, 0.9vw, 0.8rem); }
        body.is-fullscreen #progress,
        body.is-fullscreen #navDots,
        body.is-fullscreen .presentation-actions { opacity: 0; pointer-events: none; }

        /* =============================================
           LAPTOP PRESENTATION MODE
           Add per-slide overrides inside this block.
           ============================================= */
        @media (min-width: 901px) and (max-width: 1440px),
               (min-width: 901px) and (max-height: 860px) {
            :root {
                --title-size:    clamp(1.6rem, 4.2vw, 4rem);
                --h2-size:       clamp(1.25rem, 2.9vw, 2.4rem);
                --body-size:     clamp(1.05rem, 1.2vw, 1.45rem);
                --small-size:    clamp(0.9rem, 0.94vw, 1.05rem);
                --slide-padding: clamp(0.9rem, 2vw, 2rem);
                --content-gap:   clamp(0.5rem, 0.95vw, 0.95rem);
                --element-gap:   clamp(0.28rem, 0.58vw, 0.58rem);
                --stage-margin:  clamp(0.75rem, 1.7vw, 1.7rem);
            }
            /* Per-slide compact overrides go here */
        }

        /* =============================================
           SLIDE-SPECIFIC STYLES GO BELOW THIS LINE
           ============================================= */

    </style>
</head>
<body>

    <!-- ===== SLIDE 1: TITLE ===== -->
    <section class="slide slide-title" aria-label="Slide 1">
        <div class="slide-stage">
        <div class="slide-content">
            <div class="title-shell reveal">
                <p class="kicker">Kicker · Date</p>
                <h1>Presentation Title</h1>
                <div class="subtitle-block">
                    <p class="subtitle">One-sentence framing statement.</p>
                </div>
                <div class="presenter-line">
                    <span>Presenter Name</span>
                    <span>Role · Institution</span>
                </div>
            </div>
        </div>
        </div>
    </section>

    <!-- ===== SLIDE 2: STATEMENT ===== -->
    <section class="slide" aria-label="Slide 2">
        <div class="slide-stage">
        <div class="slide-content" style="justify-content:center;">
            <p class="kicker reveal">Section · Context</p>
            <h2 class="reveal">One sharp sentence goes here.</h2>
            <p class="reveal">Supporting context, one or two sentences maximum.</p>
        </div>
        </div>
    </section>

    <!-- ADD MORE SLIDES HERE following patterns in references/slide-patterns.md -->

    <!-- ===== PRESENTATION INFRASTRUCTURE ===== -->
    <div id="progress"></div>
    <div id="navDots"></div>
    <div class="presentation-actions">
        <button class="fullscreen-toggle" id="fullscreenToggle" aria-pressed="false" title="Toggle fullscreen (F)">
            Full screen
        </button>
    </div>

    <script>
        class SlidePresentation {
            constructor() {
                this.slides = [...document.querySelectorAll('.slide')];
                this.progress = document.getElementById('progress');
                this.navDots = document.getElementById('navDots');
                this.fullscreenToggle = document.getElementById('fullscreenToggle');
                this.currentSlide = 0;
                this.buildNavDots();
                this.initFullscreenControls();
                this.bindEvents();
                this.observeSlides();
                this.slides[0]?.classList.add('visible');
                this.updateUI(0);
            }

            buildNavDots() {
                this.slides.forEach((_, index) => {
                    const dot = document.createElement('button');
                    dot.setAttribute('aria-label', `Go to slide ${index + 1}`);
                    dot.addEventListener('click', () => this.goToSlide(index));
                    this.navDots.appendChild(dot);
                });
            }

            bindEvents() {
                window.addEventListener('keydown', (event) => {
                    if (event.key === 'f' || event.key === 'F') {
                        event.preventDefault();
                        this.toggleFullscreen().catch((err) => console.warn('fullscreen:', err));
                        return;
                    }
                    if (event.key === 'ArrowDown' || event.key === 'ArrowRight' || event.key === ' ') {
                        event.preventDefault();
                        this.goToSlide(Math.min(this.currentSlide + 1, this.slides.length - 1));
                    }
                    if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                        event.preventDefault();
                        this.goToSlide(Math.max(this.currentSlide - 1, 0));
                    }
                });
            }

            observeSlides() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            const idx = this.slides.indexOf(entry.target);
                            this.currentSlide = idx;
                            entry.target.classList.add('visible');
                            this.updateUI(idx);
                        }
                    });
                }, { threshold: 0.55 });
                this.slides.forEach((slide) => observer.observe(slide));
            }

            goToSlide(index) {
                this.slides[index]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            updateUI(index) {
                const pct = ((index + 1) / this.slides.length) * 100;
                this.progress.style.width = `${pct}%`;
                [...this.navDots.children].forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
            }

            initFullscreenControls() {
                if (!this.fullscreenToggle) return;
                this.fullscreenToggle.addEventListener('click', () => {
                    this.toggleFullscreen().catch((err) => console.warn('fullscreen:', err));
                });
                document.addEventListener('fullscreenchange', () => this.syncFullscreenState());
                document.addEventListener('webkitfullscreenchange', () => this.syncFullscreenState());
                this.syncFullscreenState();
            }

            getFullscreenElement() {
                return document.fullscreenElement || document.webkitFullscreenElement || null;
            }

            async toggleFullscreen() {
                const el = this.getFullscreenElement();
                if (el) {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    return;
                }
                const root = document.documentElement;
                if (root.requestFullscreen) await root.requestFullscreen();
                else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
            }

            syncFullscreenState() {
                const isFullscreen = !!this.getFullscreenElement();
                document.body.classList.toggle('is-fullscreen', isFullscreen);
                if (!this.fullscreenToggle) return;
                this.fullscreenToggle.textContent = isFullscreen ? 'Exit full screen' : 'Full screen';
                this.fullscreenToggle.setAttribute('aria-pressed', isFullscreen ? 'true' : 'false');
                this.fullscreenToggle.setAttribute('title',
                    isFullscreen ? 'Exit fullscreen (F or Esc)' : 'Toggle fullscreen (F)');
            }
        }

        new SlidePresentation();
    </script>
</body>
</html>
